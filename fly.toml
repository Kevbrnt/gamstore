app = "gamestoreprojet"
primary_region = "cdg"

[build]
dockerfile = "build/Dockerfile"

[http_service]
internal_port = 80
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/"

[ssh]
use_ssh_agent = true

[env]
APACHE_RUN_USER = "www-data"
APACHE_RUN_GROUP = "www-data"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024

[deploy]
release_command = "sh -c 'ls -la /var/www/html && cat /etc/apache2/sites-available/000-default.conf && apache2ctl -S'"